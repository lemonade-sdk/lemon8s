name: End-to-end on the CPU
description: Install lemon8s with no devices and Lemonade's CPU backend, then run the end-to-end tests against it.

inputs:
  upgrade-from:
    description: Install this chart first, download a model, then upgrade to this commit's chart as the playbook does.
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      with:
        version: ${{ env.HELM_VERSION }}

    - name: Install lemon8s on the CPU
      shell: bash
      env:
        CHART: ${{ inputs.upgrade-from || 'deploy/chart/lemon8s' }}
      run: |
        kubectl create namespace lemonade
        kubectl label namespace lemonade pod-security.kubernetes.io/enforce=restricted
        helm install lemonade "$CHART" --namespace lemonade --set devices=null --set backend=cpu
        kubectl -n lemonade rollout status deploy/lemonade --timeout=15m

    - name: Download a model, then upgrade to this commit's chart, which keeps it, the keys, and the values
      if: inputs.upgrade-from
      shell: bash
      env:
        BASE_CHART: ${{ inputs.upgrade-from }}
      run: |
        helm lint --strict deploy/chart/lemon8s -f "$BASE_CHART/tests/all-values.yaml"
        kubectl -n lemonade exec deploy/lemonade -- lemonade pull "$MODEL"
        kubectl -n lemonade exec deploy/lemonade -- lemonade list --downloaded | grep -w "$MODEL"
        kubectl -n lemonade get secret lemonade-api-key -o jsonpath='{.data}' | sha256sum > "$RUNNER_TEMP/keys.sha256"
        helm -n lemonade upgrade lemonade deploy/chart/lemon8s --reset-then-reuse-values
        kubectl -n lemonade rollout status deploy/lemonade --timeout=15m
        kubectl -n lemonade exec deploy/lemonade -- lemonade list --downloaded | grep -w "$MODEL"
        kubectl -n lemonade get secret lemonade-api-key -o jsonpath='{.data}' | sha256sum -c "$RUNNER_TEMP/keys.sha256"

    - name: No other pod reaches Lemonade, until its NetworkPolicy is removed
      shell: bash
      run: |
        ip=$(kubectl -n lemonade get pod -l app.kubernetes.io/component=lemonade -o jsonpath='{.items[0].status.podIP}')
        kubectl -n default run reach-lemonade --restart=Never \
          --image=docker.io/library/busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec -- sleep 600
        kubectl -n default wait pod/reach-lemonade --for=condition=Ready --timeout=2m
        reach() {
          kubectl -n default exec reach-lemonade -- sh -c "wget -q -T 5 -O /dev/null http://$ip:13305/live && echo reached || echo blocked"
        }
        result=$(reach)
        echo "A pod in another namespace: $result"
        grep -qx blocked <<< "$result"
        kubectl -n lemonade delete networkpolicy lemonade
        for _ in 1 2 3 4 5; do
          result=$(reach)
          grep -qx reached <<< "$result" && break
          sleep 3
        done
        echo "The same pod, without the NetworkPolicy: $result"
        grep -qx reached <<< "$result"
        kubectl -n default delete pod reach-lemonade --wait=false

    - name: End-to-end tests
      shell: bash
      run: |
        python -m pip install --require-hashes -r tests/requirements.txt
        kubectl -n lemonade port-forward svc/lemonade 13308 >"$RUNNER_TEMP/port-forward.log" 2>&1 &
        curl -sf --retry 60 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:13308/live ||
          { echo "Lemonade didn't answer through the port-forward"; exit 1; }
        export OPENAI_BASE_URL=http://localhost:13308/v1
        OPENAI_API_KEY=$(kubectl -n lemonade get secret lemonade-api-key -o jsonpath='{.data.api-key}' | base64 -d)
        export OPENAI_API_KEY
        python -m pytest tests --backend cpu --model "$MODEL"
