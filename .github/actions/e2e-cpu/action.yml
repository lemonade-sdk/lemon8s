name: End-to-end on the CPU
description: Install lemon8s with no devices and Lemonade's CPU backend, then run the end-to-end tests against it.

inputs:
  slow:
    description: Whether to also run the tests marked slow, which download large models.
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      with:
        version: ${{ env.HELM_VERSION }}

    - name: Install lemon8s on the CPU
      shell: bash
      run: |
        kubectl create namespace lemonade
        kubectl label namespace lemonade pod-security.kubernetes.io/enforce=restricted
        helm install lemonade deploy/chart/lemon8s --namespace lemonade --set devices=null --set backend=cpu
        kubectl -n lemonade rollout status deploy/lemonade --timeout=15m

    - name: No other pod reaches Lemonade
      shell: bash
      run: |
        ip=$(kubectl -n lemonade get pod -l app.kubernetes.io/component=lemonade -o jsonpath='{.items[0].status.podIP}')
        result=$(kubectl -n default run reach-lemonade --rm -i --restart=Never --quiet \
          --image=docker.io/library/busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec \
          -- sh -c "wget -q -T 5 -O /dev/null http://$ip:13305/live && echo reached || echo blocked")
        echo "A pod in another namespace: $result"
        grep -q '^blocked$' <<< "$result"

    - name: End-to-end tests
      shell: bash
      env:
        SLOW: ${{ inputs.slow }}
      run: |
        python -m pip install --require-hashes -r tests/requirements.txt
        kubectl -n lemonade port-forward svc/lemonade 13308 >"$RUNNER_TEMP/port-forward.log" 2>&1 &
        curl -sf --retry 60 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:13308/live ||
          { echo "Lemonade didn't answer through the port-forward"; exit 1; }
        export OPENAI_BASE_URL=http://localhost:13308/v1
        OPENAI_API_KEY=$(kubectl -n lemonade get secret lemonade-api-key -o jsonpath='{.data.api-key}' | base64 -d)
        export OPENAI_API_KEY
        if [ "$SLOW" = true ]; then markers=""; else markers="not slow"; fi
        python -m pytest tests --backend cpu -m "$markers" --strict-markers -v --durations=0
