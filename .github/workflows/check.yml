name: Check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HELM_VERSION: v4.3.2
  K3S_VERSION: v1.37.2+k3s1
  K3S_INSTALL_SHA256: ed01f89fd977bf20ac1516bbebf8370bf3ddbaa55dac8aba610956a4c78cc00b
  MODEL: Qwen3-0.6B-GGUF
  RUFF_VERSION: 0.17.6

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Spelling
        uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2

      - name: Markdown
        uses: DavidAnson/markdownlint-cli2-action@3ce8f712b5d8f31acd8e201be6d97e3d2bb23eb7 # v25.1.0
        with:
          config: .github/.markdownlint.yaml
          globs: "**/*.md"

      - name: Links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress --hidden .

      - name: Python lint
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: ${{ env.RUFF_VERSION }}

      - name: Python format
        run: ruff format --check

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Chart
        run: |
          every=deploy/chart/lemon8s/tests/all-values.yaml
          helm lint --strict deploy/chart/lemon8s --set "deviceGroups={992}"
          helm lint --strict deploy/chart/lemon8s -f "$every"
          {
            helm template lemonade deploy/chart/lemon8s --set "deviceGroups={992}"
            echo ---
            helm template lemonade deploy/chart/lemon8s -f "$every"
          } > "$RUNNER_TEMP/chart.yaml"
          for kubernetes in 1.35.0 1.36.0 "${K3S_VERSION%%+*}"; do
            docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
              -strict -summary -kubernetes-version "${kubernetes#v}" - < "$RUNNER_TEMP/chart.yaml"
          done
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD/deploy/chart:/apps" \
            docker.io/helmunittest/helm-unittest:4.3.0-1.2.1@sha256:28ea86c3e0b07f501f0c2e9c08b9f41e240f4a4b571cb5106b36cf0f0607e989 lemon8s

      - name: Workflows and scripts
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
          docker run --rm -v "$PWD:/repo" -w /repo --entrypoint shellcheck \
            docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 .github/scripts/*.sh

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            crates/target/
          key: rust-${{ hashFiles('crates/rust-toolchain.toml', 'crates/Cargo.lock') }}

      - name: Toolchain, cargo-deny, and cargo-about
        run: |
          rustup toolchain install
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/cargo-deny.tar.gz" \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.22.1/cargo-deny-0.22.1-x86_64-unknown-linux-musl.tar.gz
          echo "13f7e825e9cb811c2f8de63f29b0f45851dfb53004029f0f2501af524728364d  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$RUNNER_TEMP/bin" --strip-components=1 \
            cargo-deny-0.22.1-x86_64-unknown-linux-musl/cargo-deny
          curl -fsSL -o "$RUNNER_TEMP/cargo-about.tar.gz" \
            https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.3/cargo-about-0.9.3-x86_64-unknown-linux-musl.tar.gz
          echo "3ad1e94ea1e63d69d1961f4fb15ccbbe9575d906111f96d2cb4dce6df48f71b4  $RUNNER_TEMP/cargo-about.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cargo-about.tar.gz" -C "$RUNNER_TEMP/bin" --strip-components=1 \
            cargo-about-0.9.3-x86_64-unknown-linux-musl/cargo-about
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Format
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Kind
        timeout-minutes: 10
        run: bash ../.github/scripts/cluster.sh kind

      - name: Control against the API server
        run: LEMON8S_KUBECONFIG=$KUBECONFIG cargo test --workspace --locked --test kube -- --ignored

      - name: Licenses, advisories, and sources
        run: cargo deny --log-level error check --show-stats

      - name: Notices
        run: |
          cargo about init
          cargo about generate --fail --locked -o "$RUNNER_TEMP/NOTICES.html" about.hbs

  comment-slop:
    name: Comment check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Comments in the change
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/check_comment_slop.py" \
            https://raw.githubusercontent.com/lemonade-sdk/lemonade/371f38cc1489fe3d5dbd1df86f2773139f07619d/tools/check_comment_slop.py
          echo "fd8a1e7fd76df08cd01a51239680cb998af9523322058a70a51380bff686d089  $RUNNER_TEMP/check_comment_slop.py" | sha256sum -c -
          git fetch --no-tags origin "$BASE_REF"
          python3 -I "$RUNNER_TEMP/check_comment_slop.py" --from-ref "$(git merge-base "origin/$BASE_REF" HEAD)" --to-ref HEAD

  e2e-cpu:
    name: End-to-end on the CPU, after an upgrade
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: K3s
        timeout-minutes: 15
        run: bash .github/scripts/cluster.sh k3s

      - name: Base chart
        run: |
          mkdir "$RUNNER_TEMP/base"
          git archive HEAD^ deploy/chart/lemon8s | tar -x -C "$RUNNER_TEMP/base"

      - name: Install the base chart, upgrade to this one, and run the end-to-end tests
        uses: ./.github/actions/e2e-cpu
        timeout-minutes: 20
        with:
          upgrade-from: ${{ runner.temp }}/base/deploy/chart/lemon8s

      - name: Roll back to the base chart
        run: |
          helm -n lemonade rollback lemonade 1
          kubectl -n lemonade rollout status deploy/lemonade --timeout=15m
          kubectl -n lemonade exec deploy/lemonade -- lemonade list --downloaded | grep -w "$MODEL"
          kubectl -n lemonade get secret lemonade-api-key -o jsonpath='{.data}' | sha256sum -c "$RUNNER_TEMP/keys.sha256"

      - name: Upgrade again, uninstall, which keeps the models' volume, and install again
        run: |
          helm -n lemonade upgrade lemonade deploy/chart/lemon8s --reset-then-reuse-values
          kubectl -n lemonade rollout status deploy/lemonade --timeout=15m
          helm -n lemonade uninstall lemonade --cascade foreground
          # The Deployment stays until its pods are gone; Helm's own --wait sometimes returns before then (helm/helm#32261).
          kubectl -n lemonade wait --for=delete deploy/lemonade --timeout=5m
          kubectl -n lemonade get pvc lemonade-models
          helm install lemonade deploy/chart/lemon8s --namespace lemonade --set devices=null --set backend=cpu
          kubectl -n lemonade rollout status deploy/lemonade --timeout=15m
          kubectl -n lemonade exec deploy/lemonade -- lemonade list --downloaded | grep -w "$MODEL"

      - name: Cluster state
        if: ${{ !success() }}
        run: bash .github/scripts/cluster-state.sh k3s

  e2e-windows:
    name: End-to-end on Windows, through Rancher Desktop
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Rancher Desktop
        run: |
          curl -fsSL -o rancher-desktop.msi \
            https://github.com/rancher-sandbox/rancher-desktop/releases/download/v1.25.0/Rancher.Desktop.Setup.1.25.0.msi
          echo "4d75ded96424bcf0429fa310cbf61fb057fbd7860f6376eecbc20ed2623372a393f5fb242efd6767ccb4b0091b096ee77e62c07097011864cc4be30014275ff0  rancher-desktop.msi" |
            sha512sum -c -

      - name: Install Rancher Desktop
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\rancher-desktop-install.log"
          $install = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/i', 'rancher-desktop.msi', '/passive', 'ALLUSERS=1', '/lv*x', $log
          if ($install.ExitCode -ne 0) { Get-Content $log -Tail 50; exit $install.ExitCode }
          'C:\Program Files\Rancher Desktop\resources\resources\win32\bin' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Start Kubernetes in Rancher Desktop
        timeout-minutes: 10
        env:
          RD_LOGS_DIR: ${{ runner.temp }}/rd-logs
        run: |
          rdctl start --no-modal-dialogs --application.updater.enabled=false --application.telemetry.enabled=false \
            --kubernetes.enabled --kubernetes.version=1.37.1 \
            --container-engine.name=containerd --wait --wait-timeout 8m
          timeout 120 bash -c 'until kubectl get nodes | grep -q " Ready"; do sleep 5; done' || { kubectl get nodes -o wide; exit 1; }

      - name: Install lemon8s and run the end-to-end tests
        uses: ./.github/actions/e2e-cpu
        timeout-minutes: 10

      - name: Cluster state
        if: ${{ !success() }}
        run: |
          kubectl get pods,pvc,events -A || true
          kubectl -n lemonade describe pod,pvc || true
          kubectl -n lemonade logs deploy/lemonade --tail=200 || true
          cat "$RUNNER_TEMP/port-forward.log" || true
          tail -n 200 "$RUNNER_TEMP"/rd-logs/{k3s,background,wsl}.log || true

  e2e-flavors:
    name: End-to-end on ${{ matrix.flavor }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        flavor: [kind, k0s, minikube, rke2, kubeadm]
    env:
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Cluster
        timeout-minutes: 15
        run: bash .github/scripts/cluster.sh "$FLAVOR"

      - name: Install lemon8s and run the end-to-end tests
        uses: ./.github/actions/e2e-cpu
        timeout-minutes: 20

      - name: Cluster state
        if: ${{ !success() }}
        run: bash .github/scripts/cluster-state.sh "$FLAVOR"

  checks:
    name: Checks
    if: always()
    needs: [lint, rust, comment-slop, e2e-cpu, e2e-windows, e2e-flavors]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every required check passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS" >/dev/null
