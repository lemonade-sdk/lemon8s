apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: npu-device-plugin
  namespace: kube-system
  labels:
    app.kubernetes.io/name: npu-device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: npu-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: npu-device-plugin
    spec:
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      containers:
        - name: generic-device-plugin
          image: ghcr.io/squat/generic-device-plugin:0.2.0@sha256:66c8d5c270eb2b721f1064c549b9b7898152a6d2f0163380a5d37dc7636c20ff
          args:
            - --device
            - '{"name": "npu", "groups": [{"paths": [{"path": "/dev/accel/accel*"}]}]}'
            - --listen=127.0.0.1:8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev
              readOnly: true
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: dev
          hostPath:
            path: /dev
