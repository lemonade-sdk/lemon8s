suite: the models' volume
templates:
  - pvc.yaml
tests:
  - it: uses the default storage class unless one is named
    asserts:
      - notExists:
          path: spec.storageClassName

  - it: keeps the volume when lemon8s is uninstalled
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: uses the storage class it is given
    set:
      storage.className: fast-ssd
    asserts:
      - equal:
          path: spec.storageClassName
          value: fast-ssd
