{{- with .Values.apiKey.existingSecret }}
{{- $own := (lookup "v1" "Secret" $.Release.Namespace .).data }}
{{- if and $own (or (not (index $own "api-key")) (eq (index $own "api-key") (index $own "admin-api-key" | default ""))) }}
{{- fail (printf "Secret %s needs two different, non-empty keys: api-key and admin-api-key" .) }}
{{- end }}
{{- else }}
{{- $name := printf "%s-api-key" .Release.Name }}
{{- $data := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "lemon8s.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ index $data "api-key" | default (randAlphaNum 48 | b64enc) }}
  admin-api-key: {{ index $data "admin-api-key" | default (randAlphaNum 48 | b64enc) }}
{{- end }}
