[package]
name = "control"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
futures = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
k8s-openapi = { version = "0.29", features = ["v1_37", "schemars"] }
kube = { version = "5.1", default-features = false, features = ["aws-lc-rs", "client", "derive", "runtime", "rustls-tls"] }
parking_lot = "0.13"
policy = { path = "../policy" }
rusqlite = { version = "0.43", features = ["bundled", "fallible_uint"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
aws-lc-rs = "1.19"
tempfile = "3"
