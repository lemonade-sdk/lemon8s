# cargo-about's accept list, kept in step with deny.toml's [licenses] allow list and exceptions.
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

# Mozilla's root certificates are data, under a permissive data license;
# matches deny.toml's exceptions for webpki-root-certs.
[webpki-root-certs]
accepted = ["CDLA-Permissive-2.0"]
