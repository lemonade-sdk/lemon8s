[workspace]
members = ["control", "policy"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow" # docs never re-narrate a signature
missing_panics_doc = "allow" # docs never re-narrate a signature
must_use_candidate = "allow" # would scatter #[must_use] over most functions

[profile.dev]
debug = "line-tables-only"
